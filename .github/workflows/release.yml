name: Release a plugin

on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          run-install: false
      # checks the tag against the manifest and writes dist/<plugin>-<version>.tar.gz
      - name: pack it
        id: pack
        run: |
          archive=$(node scripts/release.ts "$GITHUB_REF_NAME")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pack.outputs.archive }}
      # with immutable releases on (a repository setting), assets go on while it's a draft and the
      # release is then published; GitHub signs a release attestation `bogey plugins add` checks
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes "$ARCHIVE"
          gh release edit "$GITHUB_REF_NAME" --draft=false
