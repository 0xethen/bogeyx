name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugins

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      # the same layout as a local checkout: plugins/ next to Bogey's monorepo/
      - uses: actions/checkout@v7.0.1
        with:
          path: plugins
      - uses: actions/checkout@v7.0.1
        with:
          repository: 0xethen/bogey
          path: monorepo
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
          cache-dependency-path: monorepo/pnpm-lock.yaml
          run-install: |
            - cwd: monorepo
      # plugins import @bogey/* and React from Bogey; link before installing the package's own tools
      - run: node tools/cli/src/bin.ts plugins link ../plugins
        working-directory: monorepo
      - run: vp install
      - run: vp check
      - run: vp test
      - run: vp run index:check
