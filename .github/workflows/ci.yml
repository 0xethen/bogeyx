name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugins

jobs:
  ready:
    runs-on: ubuntu-latest
    # write access is only used to push the formatting commit on main
    permissions:
      contents: write
    steps:
      # the same layout as a local checkout: plugins/ next to Bogey's monorepo/
      - uses: actions/checkout@v7
        with:
          path: plugins
      - uses: actions/checkout@v7
        with:
          repository: 0xethen/bogey
          path: monorepo
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          cache-dependency-path: monorepo/pnpm-lock.yaml
          run-install: |
            - cwd: monorepo
      # plugins import @bogey/* and React from Bogey; link before installing the package's own tools
      - run: node tools/cli/src/bin.ts plugins link ../plugins
        working-directory: monorepo
      - run: vp install
      # formatting alone never fails the run: format first, then check the rest
      - run: vp fmt
      - name: commit formatting (main only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "style: format with vp fmt"
          git push
      - run: vp check
      - run: vp test
      - run: vp run index:check

  # The i18n catalogs are still being filled in: a gap shows here as a warning, not a failed run.
  i18n-catalogs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugins
      - uses: actions/checkout@v7
        with:
          repository: 0xethen/bogey
          path: monorepo
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          cache-dependency-path: monorepo/pnpm-lock.yaml
          run-install: |
            - cwd: monorepo
      - run: node tools/cli/src/bin.ts plugins link ../plugins
        working-directory: monorepo
      - run: vp install
      - id: catalogs
        run: vp test plugins/i18n/tests/catalogs.test.ts
        env:
          I18N_CATALOGS: "1"
      - if: failure() && steps.catalogs.outcome == 'failure'
        run: echo "::warning title=i18n catalogs::A catalog is behind Bogey's English messages; see the catalogs step for the keys."
